version: 1

repositories:
  backend:
    path: ./backend
    baseRef: main
    role: backend
  frontend:
    path: ./frontend
    baseRef: main
    role: frontend

openapi:
  repository: backend
  path: docs/openapi.yaml

contracts:
  - name: UpdateBook
    openapiSchema: UpdateBookRequest
    typescript:
      repository: frontend
      file: src/types/book.ts
      type: UpdateBookPayload
